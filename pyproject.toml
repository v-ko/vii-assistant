[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vii-assistant"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "PySide6",
  "Pillow",
  "requests",
  "click",
  "fastapi",
  "uvicorn",
  "qwen-vl-utils",
  "pytesseract",
]

[project.scripts]
vii-assistant = "assistant.main:main"


[project.optional-dependencies]
dev = ["black>=24.0.0", "isort>=5.12.0", "pre-commit>=3.5.0"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
combine_as_imports = true
