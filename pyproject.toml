[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vii-assistant"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "PySide6",
    "Pillow",
    "requests",
    "click",
    "fastapi",
    "uvicorn",
]

[project.scripts]
vii-assistant = "assistant.main:main"
